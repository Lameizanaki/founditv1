<div class="w-full bg-[#f6f7f9]">
  <!-- landing-header-component -->
  <landing-header />
  <div class="bg-[#f8f9fb] px-4 py-6 md:px-8 lg:px-10">
    <div
      *ngIf="isLoading"
      class="mx-auto w-full max-w-7xl rounded-2xl border border-[#d9dce3] bg-white p-10 text-center text-[#64748b]"
    >
      Loading freelancer details...
    </div>

    <div
      *ngIf="!isLoading && errorMessage"
      class="mx-auto w-full max-w-7xl rounded-2xl border border-[#fecaca] bg-[#fef2f2] p-6 text-center text-[#b91c1c]"
    >
      {{ errorMessage }}
    </div>

    <ng-container *ngIf="!isLoading && freelancer">
      <!-- content-component -->
      <app-freelancer-profile-component [freelancer]="freelancer" [freelancerId]="freelancerId" />
      <!-- skills-component -->
      <app-freelancer-skills-component [skills]="skills" />
      <!-- active gigs -->
      <app-freelancer-active-gigs-component
        [gigs]="freelancer.activeService || []"
        [freelancerId]="freelancerId"
      />
      <!-- experience-component -->
      <app-freelancer-experience-component [experiences]="landingExperiences" />
      <!-- reviews-component -->
      <app-freelancer-review-component [reviews]="reviews" />
    </ng-container>

    <!-- landing-footer-component -->
    <div class="mt-12">
      <landing-footer />
    </div>
  </div>
</div>
