<div class="min-h-screen bg-[#f8f8f8] px-6 py-8 md:px-10 lg:px-16">
  <div class="mx-auto grid min-h-[60vh] w-full place-items-center">
    <div class="w-full max-w-md text-center">
      <p *ngIf="!errorMessage" class="text-sm font-medium text-gray-700">
        Signing you in with Google…
      </p>
      <p *ngIf="errorMessage" class="text-sm font-medium text-red-600">
        {{ errorMessage }}
      </p>
    </div>
  </div>
</div>
