<div class="min-h-screen bg-[#f8f8f8] px-6 py-8 md:px-10 lg:px-16">
  <div class="mx-auto w-full">
    <!-- Logo -->
    <div class="flex justify-center mb-3">
      <div class="w-32 h-16 flex items-center">
        <img class="w-full h-full object-contain" src="/assets/images/logo.png" alt="FOUNDIT" />
      </div>
    </div>

    <!-- Main content -->
    <div class="grid grid-cols-1 overflow-hidden rounded-2xl bg-[#f8f8f8] lg:grid-cols-2">
      <!-- Left side -->
      <div class="flex items-center justify-center px-4 py-6 sm:px-8 md:px-12 lg:px-14">
        <div class="w-full max-w-2xl">
          <h2 class="mb-2 text-[42px] font-bold leading-tight text-gray-900">Welcome back</h2>
          <p class="mb-8 text-[18px] text-gray-500">Sign in to continue</p>

          <div
            *ngIf="errorMessage"
            class="mb-5 rounded-xl border border-[#fecaca] bg-[#fef2f2] px-4 py-3 text-sm font-medium text-[#dc2626]"
          >
            {{ errorMessage }}
          </div>

          <!-- Social buttons -->
          <div class="space-y-3">
            <button
              type="button"
              (click)="continueWithGoogle()"
              class="flex h-12 w-full items-center justify-center gap-3 rounded-xl border border-gray-200 bg-white text-sm font-medium text-gray-700 transition hover:bg-gray-50"
            >
              <img
                src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg"
                alt="Google"
                class="h-4 w-4"
              />
              <span>Continue with Google</span>
            </button>

          </div>

          <!-- Divider -->
          <div class="my-7 flex items-center gap-4">
            <div class="h-px flex-1 bg-gray-200"></div>
            <span class="text-sm text-gray-400">or use email</span>
            <div class="h-px flex-1 bg-gray-200"></div>
          </div>

          <!-- Form -->
          <form (ngSubmit)="onSubmit()" class="space-y-5">
            <div>
              <label for="email" class="mb-2 block text-sm font-medium text-gray-600">
                Email
              </label>
              <input
                id="email"
                name="email"
                type="email"
                [(ngModel)]="email"
                placeholder="you@example.com"
                class="h-12 w-full rounded-xl border border-transparent bg-[#f1f1f3] px-4 text-sm outline-none placeholder:text-gray-400 focus:border-[#16a34a] focus:bg-white"
              />
            </div>

            <div>
              <div class="mb-2 flex items-center justify-between">
                <label for="password" class="block text-sm font-medium text-gray-600">
                  Password
                </label>
                <a
                  routerLink="/auth/forget-password"
                  class="text-sm font-medium text-blue-500 hover:underline"
                >
                  Forgot?
                </a>
              </div>

              <div class="relative">
                <input
                  id="password"
                  name="password"
                  [type]="showPassword ? 'text' : 'password'"
                  [(ngModel)]="password"
                  placeholder="Enter your password"
                  class="h-12 w-full rounded-xl border border-transparent bg-[#f1f1f3] px-4 pr-12 text-sm outline-none placeholder:text-gray-400 focus:border-[#16a34a] focus:bg-white"
                />

                <button
                  type="button"
                  (click)="togglePasswordVisibility()"
                  class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600"
                >
                  <lucide-angular [img]="icons.Eye" class="h-5 w-5"></lucide-angular>
                </button>
              </div>
            </div>

            <div class="flex items-center gap-2">
              <input
                id="rememberMe"
                name="rememberMe"
                type="checkbox"
                [(ngModel)]="rememberMe"
                class="h-4 w-4 rounded border-gray-300 text-green-600 focus:ring-green-500"
              />
              <label for="rememberMe" class="text-sm text-gray-700"> Remember me </label>
            </div>

            <div class="pt-2">
              <button
                type="submit"
                class="h-12 w-full rounded-xl bg-[#08b239] text-sm font-semibold text-white transition hover:bg-[#069d32]"
              >
                Sign in
              </button>
            </div>

            <p class="pt-2 text-center text-sm text-gray-500">
              New here?
              <a routerLink="/auth/sign-up" class="font-medium text-blue-500 hover:underline">
                Create account
              </a>
            </p>
          </form>
        </div>
      </div>

      <!-- Right side -->
      <div class="hidden lg:flex lg:border-l lg:border-gray-200">
        <div class="flex w-full items-center justify-center p-8">
          <div class="flex h-full w-full items-center justify-center rounded-none bg-transparent">
            <div class="text-center text-gray-400">
              <img
                class="w-full h-full object-contain"
                src="assets/images/auth.png"
                alt="auth.image"
              />
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
