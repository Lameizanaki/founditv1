<div class="w-full max-w-7xl mt-6 mx-auto">
  <div class="rounded-2xl border border-[#d9dce3] bg-white p-5 shadow-sm">
    <div class="flex items-start justify-between gap-4">
      <div>
        <h2 class="text-[28px] font-semibold leading-none text-[#1f2937]">Active Gigs</h2>
        <p class="mt-2 text-sm text-[#6b7280]">
          Services offered by {{ freelancer?.freelancerName || 'this freelancer' }}
        </p>
      </div>

      <a
        [routerLink]="browseGigsLink"
        [queryParams]="browseGigsQueryParams"
        class="inline-flex items-center gap-2 rounded-xl bg-[#111827] px-4 py-2.5 text-sm font-semibold text-white transition hover:bg-[#0f172a]"
      >
        View Gigs
        <lucide-angular [img]="icons.ChevronRight" class="h-4 w-4"></lucide-angular>
      </a>
    </div>

    <div
      *ngIf="displayGigs.length === 0"
      class="mt-6 rounded-xl border border-dashed border-[#d1d5db] p-8 text-center text-[#6b7280]"
    >
      No active gigs available.
    </div>

    <div class="mt-6 grid grid-cols-1 gap-5 md:grid-cols-2 xl:grid-cols-2">
      <a
        *ngFor="let gig of displayGigs"
        [routerLink]="['/client/browse-gigs/gig', gig.id]"
        class="overflow-hidden rounded-2xl border border-[#e5e7eb] bg-white transition hover:-translate-y-0.5 hover:shadow-md"
      >
        <div class="relative h-48 w-full overflow-hidden bg-[#f3f4f6]">
          <img
            *ngIf="gig.image"
            [src]="gig.image"
            [alt]="gig.title"
            class="h-full w-full object-cover"
          />
          <div
            *ngIf="!gig.image"
            class="grid h-full w-full place-items-center text-sm font-medium text-[#9ca3af]"
          >
            No image
          </div>

          <span
            class="absolute left-3 top-3 rounded-md px-2.5 py-1 text-xs font-semibold"
            [ngClass]="getStatusClasses(gig.status)"
          >
            {{ gig.status }}
          </span>
        </div>

        <div class="p-4">
          <h3 class="line-clamp-2 min-h-14 text-[20px] font-semibold leading-7 text-[#374151]">
            {{ gig.title }}
          </h3>

          <div class="mt-3 flex items-center gap-2 text-sm text-[#6b7280]">
            <span class="inline-flex items-center gap-1 font-semibold text-[#f59e0b]">
              <lucide-angular [img]="icons.Star" class="h-4 w-4 fill-current"></lucide-angular>
              {{ gig.rating }}
            </span>
            <span>({{ gig.reviews }})</span>
            <span>{{ gig.orders }} orders</span>
          </div>

          <div class="mt-6 flex items-end justify-between">
            <div class="inline-flex items-center gap-1 text-sm text-[#6b7280]">
              <lucide-angular [img]="icons.Clock3" class="h-4 w-4"></lucide-angular>
              {{ gig.days }} days
            </div>

            <div class="text-right">
              <p class="text-sm text-[#9ca3af]">Starting at</p>
              <p class="text-[28px] font-bold leading-none text-[#374151]">${{ gig.price }}</p>
            </div>
          </div>
        </div>
      </a>
    </div>
  </div>
</div>
