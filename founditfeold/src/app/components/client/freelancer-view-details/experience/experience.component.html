<div class="w-full max-w-7xl mt-12 mx-auto">
  <div
    class="rounded-[22px] border border-[#d9dce3] bg-white px-8 py-9 shadow-[0_2px_6px_rgba(15,23,42,0.06)]"
  >
    <h2 class="mb-8 text-[22px] font-semibold text-[#111827]">
      {{ title }}
    </h2>

    <!-- Debug UI removed for production: experience debug output no longer shown -->

    <div *ngIf="isLoading" class="py-8 text-center text-sm text-[#6b7280]">
      Loading experience history...
    </div>

    <div
      *ngIf="!isLoading && errorMessage"
      class="rounded-xl border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-700"
    >
      {{ errorMessage }}
    </div>

    <div
      *ngIf="!isLoading && !errorMessage && experiences.length === 0"
      class="rounded-xl border border-dashed border-[#d9dce3] px-4 py-6 text-sm text-[#6b7280]"
    >
      No experience records found.
    </div>

    <div *ngIf="!isLoading && !errorMessage && experiences.length > 0" class="space-y-8">
      <div *ngFor="let experience of experiences" class="flex items-start gap-4">
        <div class="flex h-14 w-14 shrink-0 items-center justify-center rounded-2xl bg-[#eaf7ee]">
          <lucide-angular
            [img]="icons.BriefcaseBusiness"
            class="h-6 w-6 text-[#22c55e]"
          ></lucide-angular>
        </div>

        <div class="min-w-0">
          <h3 class="text-[20px] font-semibold leading-tight text-[#111827]">
            {{ experience.title }}
          </h3>

          <p class="mt-3 max-w-none text-[15px] leading-8 text-[#667085]">
            {{ experience.description || experience.bio || 'No experience details provided.' }}
          </p>

          <p
            *ngIf="experience.bio && experience.bio !== experience.description"
            class="mt-2 text-[14px] text-[#7b8698]"
          >
            {{ experience.bio }}
          </p>
        </div>
      </div>
    </div>
  </div>
</div>
