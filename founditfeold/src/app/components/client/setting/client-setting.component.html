<div class="min-h-screen bg-[#f8fafc] px-4 py-6 md:px-6">
  <div class="mx-auto max-w-7xl">
    <div class="mb-6 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="flex h-8 w-8 items-center justify-center rounded-full">
          <lucide-angular [img]="icons.Settings" class="h-6 w-6 text-[#2563eb]"></lucide-angular>
        </div>
        <h1 class="text-[22px] font-bold text-[#111827] md:text-[24px]">Client Settings</h1>
      </div>

      <button
        type="button"
        (click)="logout()"
        class="inline-flex items-center gap-2 text-sm font-medium text-[#ef4444] transition hover:text-[#dc2626]"
      >
        <lucide-angular [img]="icons.LogOut" class="h-4 w-4"></lucide-angular>
        Logout
      </button>
    </div>

    <div class="grid grid-cols-1 gap-5 lg:grid-cols-[170px_minmax(0,1fr)]">
      <aside
        class="h-fit rounded-2xl border border-[#e5e7eb] bg-white p-2 shadow-[0_2px_8px_rgba(15,23,42,0.04)]"
      >
        <button
          *ngFor="let item of menuItems"
          type="button"
          (click)="activeTab = item.key; errorMessage = ''; successMessage = ''"
          class="mb-1 flex w-full items-center gap-3 rounded-xl px-4 py-3 text-left text-sm font-medium transition last:mb-0"
          [ngClass]="
            activeTab === item.key
              ? 'bg-[#eef2ff] text-[#2563eb]'
              : 'text-[#374151] hover:bg-[#f9fafb]'
          "
        >
          <lucide-angular [img]="item.icon" class="h-4 w-4"></lucide-angular>
          <span>{{ item.label }}</span>
        </button>
      </aside>

      <section
        class="rounded-2xl border border-[#e5e7eb] bg-white p-5 shadow-[0_2px_8px_rgba(15,23,42,0.04)] md:p-6"
      >
        <ng-container *ngIf="activeTab === 'personal'">
          <h2 class="text-[18px] font-semibold text-[#111827]">Personal Information</h2>

          <div
            class="mt-5 flex flex-col gap-4 border-b border-[#e5e7eb] pb-6 md:flex-row md:items-center"
          >
            <div class="relative h-16 w-16 overflow-hidden rounded-full ring-4 ring-[#f3f4f6]">
              <img
                [src]="avatarSrc"
                alt="Profile"
                class="h-full w-full object-cover"
              />
            </div>

            <div class="flex-1">
              <h3 class="text-xl font-semibold text-[#111827]">
                {{ profileLoaded ? profile.username : 'Loading...' }}
              </h3>
              <div class="mt-1 flex items-center gap-2 text-sm text-[#6b7280]">
                <span class="h-2 w-2 rounded-full bg-[#2563eb]"></span>
                <span>Client Account</span>
              </div>

              <button
                type="button"
                (click)="fileInput.click()"
                class="mt-3 inline-flex items-center gap-2 rounded-xl bg-[#eef2ff] px-4 py-2 text-sm font-medium text-[#2563eb] transition hover:bg-[#dbeafe]"
              >
                <lucide-angular [img]="icons.Upload" class="h-4 w-4"></lucide-angular>
                Update Profile Picture
              </button>

              <input
                #fileInput
                type="file"
                accept="image/*"
                (change)="onAvatarSelected($event)"
                class="hidden"
              />
            </div>
          </div>

          <div class="mt-6 grid grid-cols-1 gap-5 md:grid-cols-2">
            <div>
              <label class="mb-2 block text-sm font-medium text-[#374151]">Username</label>
              <input
                type="text"
                [(ngModel)]="profile.username"
                readonly
                class="h-12 w-full rounded-xl border border-[#d1d5db] bg-[#f9fafb] px-4 text-sm text-[#111827] outline-none"
              />
            </div>

            <div>
              <label class="mb-2 block text-sm font-medium text-[#374151]">Email Address</label>
              <input
                type="email"
                [(ngModel)]="profile.email"
                readonly
                class="h-12 w-full rounded-xl border border-[#d1d5db] bg-[#f9fafb] px-4 text-sm text-[#111827] outline-none"
              />
            </div>

            <div>
              <label class="mb-2 block text-sm font-medium text-[#374151]">Work Location</label>
              <input
                type="text"
                [(ngModel)]="profile.workLocation"
                class="h-12 w-full rounded-xl border border-[#d1d5db] bg-white px-4 text-sm text-[#111827] outline-none focus:border-[#2563eb]"
              />
            </div>

            <div class="md:col-span-2">
              <label class="mb-2 block text-sm font-medium text-[#374151]">About</label>
              <textarea
                [(ngModel)]="profile.about"
                rows="5"
                class="w-full resize-none rounded-xl border border-[#d1d5db] bg-white px-4 py-3 text-sm text-[#111827] outline-none focus:border-[#2563eb]"
              ></textarea>
            </div>
          </div>

          <div class="mt-6 border-t border-[#dbeafe] pt-4">
            <div class="flex items-center justify-end gap-3">
              <button
                type="button"
                (click)="loadProfile()"
                class="rounded-xl px-5 py-3 text-sm font-medium text-[#4b5563] transition hover:bg-[#f3f4f6]"
              >
                Cancel
              </button>

              <button
                type="button"
                (click)="savePersonalInformation()"
                [disabled]="isLoading"
                class="rounded-xl bg-[#2563eb] px-6 py-3 text-sm font-semibold text-white transition hover:bg-[#1d4ed8] disabled:opacity-50"
              >
                {{ isLoading ? 'Saving...' : 'Save Changes' }}
              </button>
            </div>
          </div>
        </ng-container>

        <ng-container *ngIf="activeTab === 'notifications'">
          <h2 class="text-[18px] font-semibold text-[#111827]">Notification Preferences</h2>

          <div class="mt-4 divide-y divide-[#f0f2f5] border-b border-[#f0f2f5]">
            <div
              *ngFor="let item of notifications"
              class="flex items-start justify-between gap-4 py-6"
            >
              <div>
                <h3 class="text-[16px] font-semibold text-[#111827]">{{ item.title }}</h3>
                <p class="mt-1 text-sm text-[#6b7280]">{{ item.description }}</p>
              </div>

              <button
                type="button"
                (click)="toggleNotification(item)"
                class="relative mt-1 h-7 w-12 rounded-full transition"
                [ngClass]="item.enabled ? 'bg-[#2563eb]' : 'bg-[#e5e7eb]'"
              >
                <span
                  class="absolute top-1 h-5 w-5 rounded-full bg-white shadow-sm transition"
                  [ngClass]="item.enabled ? 'left-6' : 'left-1'"
                ></span>
              </button>
            </div>
          </div>

          <div class="mt-6 flex justify-end">
            <button
              type="button"
              (click)="saveNotificationPreferences()"
              class="rounded-xl bg-[#2563eb] px-6 py-3 text-sm font-semibold text-white transition hover:bg-[#1d4ed8]"
            >
              Save Preferences
            </button>
          </div>
        </ng-container>

        <ng-container *ngIf="activeTab === 'security'">
          <h2 class="text-[18px] font-semibold text-[#111827]">Change Password</h2>

          <div class="mt-4 border-t border-[#f0f2f5] pt-5"></div>

          <div class="max-w-105 space-y-5">
            <div>
              <label class="mb-2 block text-sm font-medium text-[#374151]">Current Password</label>
              <input
                type="password"
                [(ngModel)]="security.currentPassword"
                class="h-12 w-full rounded-xl border border-[#d1d5db] bg-white px-4 text-sm text-[#111827] outline-none focus:border-[#2563eb]"
              />
            </div>

            <div>
              <label class="mb-2 block text-sm font-medium text-[#374151]">New Password</label>
              <input
                type="password"
                [(ngModel)]="security.newPassword"
                class="h-12 w-full rounded-xl border border-[#d1d5db] bg-white px-4 text-sm text-[#111827] outline-none focus:border-[#2563eb]"
              />
            </div>

            <div>
              <label class="mb-2 block text-sm font-medium text-[#374151]"
                >Confirm New Password</label
              >
              <input
                type="password"
                [(ngModel)]="security.confirmPassword"
                class="h-12 w-full rounded-xl border border-[#d1d5db] bg-white px-4 text-sm text-[#111827] outline-none focus:border-[#2563eb]"
              />
            </div>
          </div>

          <div class="mt-6 border-t border-[#f0f2f5] pt-5">
            <button
              type="button"
              (click)="changePassword()"
              [disabled]="isLoading"
              class="rounded-xl bg-[#2563eb] px-6 py-3 text-sm font-semibold text-white transition hover:bg-[#1d4ed8]"
            >
              {{ isLoading ? 'Updating...' : 'Update Password' }}
            </button>
          </div>
        </ng-container>

        <div *ngIf="errorMessage" class="mt-4 rounded-xl bg-[#fee2e2] p-4 text-sm text-[#dc2626]">
          {{ errorMessage }}
        </div>
        <div *ngIf="successMessage" class="mt-4 rounded-xl bg-[#dbeafe] p-4 text-sm text-[#2563eb]">
          {{ successMessage }}
        </div>
      </section>
    </div>
  </div>
</div>
