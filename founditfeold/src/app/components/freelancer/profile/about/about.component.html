<div class="mx-auto mt-6 w-full max-w-7xl">
  <div
    class="rounded-[22px] border border-[#d9dce3] bg-white px-8 py-8 shadow-[0_2px_6px_rgba(15,23,42,0.06)]"
  >
    <!-- Header -->
    <div class="mb-5 flex items-start justify-between">
      <h2 class="text-[18px] font-semibold text-[#1f2937]">
        {{ title }}
      </h2>

      <!-- Edit Button -->
      <button
        type="button"
        (click)="openEditModal()"
        class="inline-flex items-center gap-1.5 text-[14.5px] font-medium text-[#22c55e] transition hover:text-[#16a34a]"
      >
        <lucide-angular [img]="icons.Pencil" class="h-4 w-4"></lucide-angular>
        <span>Edit</span>
      </button>
    </div>

    <!-- Content -->
    <p
      *ngIf="description; else emptyAbout"
      class="max-w-none text-[17px] leading-[1.8] text-[#5f6b7a]"
    >
      {{ description }}
    </p>

    <ng-template #emptyAbout>
      <p class="max-w-none text-[17px] leading-[1.8] italic text-[#9ca3af]">Write something</p>
    </ng-template>

    <p *ngIf="errorMessage" class="mt-4 text-sm text-[#dc2626]">
      {{ errorMessage }}
    </p>
  </div>
</div>

<!-- Modal Backdrop -->
<div *ngIf="isEditOpen" class="fixed inset-0 z-40 bg-black/50" (click)="closeEditModal()"></div>

<!-- Modal -->
<div *ngIf="isEditOpen" class="fixed inset-0 z-50 flex items-center justify-center p-4">
  <div
    class="w-full max-w-152.5 overflow-hidden rounded-2xl bg-white shadow-2xl"
    (click)="$event.stopPropagation()"
  >
    <!-- Modal Header -->
    <div class="flex items-center justify-between border-b border-[#e5e7eb] px-5 py-4">
      <h3 class="text-[18px] font-semibold text-[#1f2937]">Edit About</h3>

      <button
        type="button"
        (click)="closeEditModal()"
        class="inline-flex h-8 w-8 items-center justify-center rounded-full text-[#94a3b8] transition hover:bg-[#f3f4f6] hover:text-[#475569]"
      >
        ✕
      </button>
    </div>

    <!-- Modal Body -->
    <div class="px-5 py-5">
      <label class="mb-2 block text-[15px] font-medium text-[#374151]">
        Professional Summary
      </label>

      <textarea
        [(ngModel)]="editedDescription"
        rows="6"
        class="w-full resize-none rounded-xl border border-[#d1d5db] px-4 py-3 text-[15px] text-[#1f2937] outline-none transition placeholder:text-[#9ca3af] focus:border-[#22c55e] focus:ring-2 focus:ring-[#bbf7d0]"
        placeholder="Write something"
      ></textarea>

      <p class="mt-3 text-[14px] text-[#7b8698]">
        Write a brief introduction of your skills and experience
      </p>
    </div>

    <!-- Modal Footer -->
    <div class="flex items-center justify-end gap-4 border-t border-[#e5e7eb] px-5 py-4">
      <button
        type="button"
        (click)="closeEditModal()"
        class="text-[15px] font-medium text-[#374151] transition hover:text-[#111827]"
      >
        Cancel
      </button>

      <button
        type="button"
        (click)="saveAbout()"
        [disabled]="isLoading"
        class="rounded-[10px] bg-[#16a34a] px-5 py-2.5 text-[15px] font-semibold text-white transition hover:bg-[#15803d]"
      >
        {{ isLoading ? 'Saving...' : 'Save Changes' }}
      </button>
    </div>
  </div>
</div>
