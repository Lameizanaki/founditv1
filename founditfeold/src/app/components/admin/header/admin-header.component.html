<header class="flex h-18 items-center justify-between border-b border-[#e5e7eb] bg-white px-6">
  <h1 class="text-[18px] font-semibold text-[#222]">
    Admin Panel
  </h1>

  <div class="flex items-center gap-4">
    <div class="relative">
      <button
        type="button"
        (click)="toggleNotifications()"
        class="relative flex h-9 w-9 items-center justify-center rounded-full text-[#374151] transition hover:bg-gray-100"
        title="Admin notifications"
        aria-label="Admin notifications"
      >
        <lucide-angular [img]="icons.Bell" class="h-5 w-5"></lucide-angular>

        <span
          *ngIf="hasUnread"
          class="absolute right-1.5 top-1.5 h-2.5 w-2.5 rounded-full bg-red-500 ring-2 ring-white"
        ></span>
      </button>

      <div
        *ngIf="isOpen"
        class="absolute right-0 top-11 z-50 w-80 overflow-hidden rounded-lg border border-[#e5e7eb] bg-white shadow-lg"
      >
        <div class="border-b border-[#e5e7eb] px-4 py-3">
          <div class="flex items-start justify-between gap-3">
            <div>
              <p class="text-sm font-semibold text-[#111827]">Admin Notifications</p>
              <p class="text-xs text-[#6b7280]">{{ notifications.length }} item(s) need attention</p>
            </div>
            <button
              *ngIf="notifications.length > 0"
              type="button"
              (click)="markNotificationsRead()"
              class="shrink-0 text-xs font-medium text-[#2563eb] transition hover:text-[#1d4ed8]"
            >
              Mark as read
            </button>
          </div>
        </div>

        <div class="max-h-96 overflow-auto">
          <button
            *ngFor="let notification of notifications"
            type="button"
            (click)="openNotification(notification)"
            class="block w-full border-b border-[#f3f4f6] px-4 py-3 text-left transition hover:bg-[#f9fafb]"
          >
            <p class="text-sm font-medium text-[#111827]">{{ notification.title }}</p>
            <p class="mt-1 line-clamp-2 text-xs leading-5 text-[#6b7280]">{{ notification.message }}</p>
            <p class="mt-2 text-[11px] font-medium text-[#9ca3af]">{{ formatDate(notification.createdAt) }}</p>
          </button>

          <div *ngIf="notifications.length === 0" class="px-4 py-8 text-center text-sm text-[#6b7280]">
            No pending reports or E-KYC requests.
          </div>
        </div>
      </div>
    </div>

    <div class="relative">
      <button
        type="button"
        (click)="toggleUserMenu()"
        class="flex h-9 w-9 items-center justify-center rounded-full bg-[#f3f4f6] text-[#374151] transition hover:bg-gray-200"
        title="Admin account"
        aria-label="Admin account"
      >
        <lucide-angular [img]="icons.CircleUserRound" class="h-5 w-5"></lucide-angular>
      </button>

      <div
        *ngIf="isUserMenuOpen"
        class="absolute right-0 top-11 z-50 w-44 overflow-hidden rounded-lg border border-[#e5e7eb] bg-white shadow-lg"
      >
        <button
          type="button"
          (click)="logout()"
          class="flex w-full items-center gap-2 px-4 py-3 text-left text-sm font-medium text-[#dc2626] transition hover:bg-[#fef2f2]"
        >
          <lucide-angular [img]="icons.LogOut" class="h-4 w-4"></lucide-angular>
          <span>Log out</span>
        </button>
      </div>
    </div>
  </div>
</header>
