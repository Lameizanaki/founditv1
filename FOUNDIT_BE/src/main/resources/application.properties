server.port=${PORT:8085}

#database url
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/foundit?currentSchema=foundit_local}
spring.datasource.username=${DB_USERNAME:vattana}
spring.datasource.password=${DB_PASSWORD:nanaSQL}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=${DB_SCHEMA:foundit_local}

# frontend url
frontend.url=${FRONTEND_URL:http://localhost:3000}

# mail url
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# google oauth
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}
spring.security.oauth2.client.registration.google.scope=openid,email,profile

# python service
ekyc.python.base-url=${EKYC_BASE_URL:http://localhost:8000}
ekyc.python.timeout-seconds=${EKYC_TIMEOUT_SECONDS:5}

# multipart temp directory
spring.servlet.multipart.location=${SPRING_MULTIPART_LOCATION:D:/temp/spring-multipart}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB
server.tomcat.max-swallow-size=20MB
# Allow larger Authorization headers (JWT) and long request metadata.
server.max-http-request-header-size=64KB


